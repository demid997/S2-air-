<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вареник От Оксаны Курбан</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Georgia', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 40px 20px;
    text-align: center;
    position: relative;
    overflow-x: hidden;

    /* ФОТО НА ФОНЕ */
    background-image: url('твоя_фотка.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  /* Затемнение поверх фото, чтобы текст читался */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(30, 15, 0, 0.55) 0%,
      rgba(60, 30, 0, 0.65) 50%,
      rgba(30, 15, 0, 0.8) 100%
    );
    z-index: -1;
  }

  /* Плавающие блёстки */
  .sparkles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #ffd966;
    border-radius: 50%;
    box-shadow: 0 0 10px 3px #ffd966;
    animation: twinkle 4s infinite ease-in-out;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  .sparkle:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; }
  .sparkle:nth-child(2) { top: 25%; left: 85%; animation-delay: 0.8s; }
  .sparkle:nth-child(3) { top: 65%; left: 20%; animation-delay: 1.6s; }
  .sparkle:nth-child(4) { top: 75%; left: 80%; animation-delay: 2.4s; }
  .sparkle:nth-child(5) { top: 45%; left: 50%; animation-delay: 3.2s; }
  .sparkle:nth-child(6) { top: 10%; left: 60%; animation-delay: 1.2s; }
  .sparkle:nth-child(7) { top: 85%; left: 45%; animation-delay: 2.1s; }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 900px;
  }

  h1 {
    font-size: clamp(2rem, 6vw, 4.5rem);
    color: #fff3d6;
    text-shadow:
      0 0 12px rgba(255, 200, 100, 0.9),
      3px 3px 0 #8b3a00,
      6px 6px 15px rgba(0,0,0,0.7);
    margin-bottom: 25px;
    letter-spacing: 2px;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .vareniki {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin: 30px 0;
  }

  .varenik {
    width: 110px;
    height: 110px;
    transition: transform 0.3s ease;
    cursor: pointer;
    filter: drop-shadow(0 0 10px rgba(255, 220, 150, 0.8))
            drop-shadow(0 6px 8px rgba(0,0,0,0.5));
    animation: bob 3s ease-in-out infinite;
  }

  .varenik:nth-child(2) { animation-delay: 0.3s; }
  .varenik:nth-child(3) { animation-delay: 0.6s; }
  .varenik:nth-child(4) { animation-delay: 0.9s; }
  .varenik:nth-child(5) { animation-delay: 1.2s; }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(3deg); }
  }

  .varenik:hover {
    transform: scale(1.2) rotate(-8deg);
    filter: drop-shadow(0 0 20px rgba(255, 230, 150, 1));
  }

  .tagline {
    font-size: clamp(1.2rem, 3.5vw, 2.2rem);
    color: #5a2d00;
    font-weight: bold;
    background: linear-gradient(180deg, #fff8e7, #ffe4b5);
    padding: 22px 40px;
    border-radius: 50px;
    border: 4px dashed #d2691e;
    box-shadow:
      0 0 25px rgba(255, 200, 100, 0.8),
      0 10px 25px rgba(0,0,0,0.4);
    margin-top: 20px;
    display: inline-block;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 200, 100, 0.8), 0 10px 25px rgba(0,0,0,0.4); }
    50% { transform: scale(1.05); box-shadow: 0 0 45px rgba(255, 220, 120, 1), 0 10px 25px rgba(0,0,0,0.4); }
  }

  footer {
    position: relative;
    z-index: 2;
    margin-top: 40px;
    color: #ffe9c4;
    font-size: 1rem;
    text-shadow: 0 0 8px rgba(0,0,0,0.9), 1px 1px 3px #000;
    opacity: 0.95;
    letter-spacing: 1px;
  }

  /* Падающие вареники-эмодзи (декор) */
  .falling {
    position: fixed;
    top: -60px;
    font-size: 2rem;
    opacity: 0.35;
    animation: fall linear infinite;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }

  .falling:nth-child(1) { left: 8%; animation-duration: 12s; animation-delay: 0s; }
  .falling:nth-child(2) { left: 25%; animation-duration: 15s; animation-delay: 3s; }
  .falling:nth-child(3) { left: 55%; animation-duration: 13s; animation-delay: 6s; }
  .falling:nth-child(4) { left: 78%; animation-duration: 17s; animation-delay: 2s; }
  .falling:nth-child(5) { left: 92%; animation-duration: 14s; animation-delay: 8s; }
</style>
</head>
